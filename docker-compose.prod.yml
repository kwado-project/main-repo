# Production stack for a single VPS. Usage: see DEPLOY.md
#   docker compose -f docker-compose.prod.yml up -d --build
# Only Caddy is exposed to the internet (80/443). Postgres and Redis stay on the private network.
x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DATABASE_URL: postgres://kwado:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/kwado
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "0"
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kwado
      POSTGRES_DB: kwado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kwado -d kwado"]
      interval: 10s
      retries: 10
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  api:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi -b 0.0.0.0:8000 -k gthread --workers ${API_WORKERS:-3} --threads 8
             --timeout 180 --max-requests 2000 --max-requests-jitter 200 --access-logfile -"
    volumes: [static:/app/staticfiles]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *backend
    command: celery -A config worker -Q celery,email,ai -l info --concurrency ${WORKER_CONCURRENCY:-4}

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  static:
  caddy_data:
  caddy_config:
