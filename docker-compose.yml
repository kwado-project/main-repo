# Local full stack. Production: managed Postgres (+ read replica, PgBouncer),
# managed Redis, Resend email, Cloudflare R2, Paystack — see README.
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: kwado, POSTGRES_PASSWORD: kwado, POSTGRES_DB: kwado }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://kwado:kwado@db:5432/kwado
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate && python manage.py seed && gunicorn config.wsgi -b 0.0.0.0:8000 -k gthread --workers 2 --threads 8 --timeout 180"
    depends_on: [db, redis]
    ports: ["8000:8000"]
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://kwado:kwado@db:5432/kwado
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker -Q celery,email,ai -l info --concurrency 4
    depends_on: [db, redis]
  beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://kwado:kwado@db:5432/kwado
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat -l info
    depends_on: [redis]
  web:
    build: ./frontend
    environment: { BACKEND_URL: http://api:8000 }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
